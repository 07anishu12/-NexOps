name: AgentFlow OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: agentflow_dev
          POSTGRES_USER: agentflow
          POSTGRES_PASSWORD: agentflow_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://agentflow:agentflow_password@127.0.0.1:5432/agentflow_dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Lint all workspaces
        run: pnpm lint

      - name: Apply database migrations
        run: pnpm --filter @agentflow/database db:migrate

      - name: Run unit & integration tests
        env:
          DATABASE_URL: postgresql://agentflow:agentflow_password@127.0.0.1:5432/agentflow_dev
        run: pnpm test

      - name: Enforce architecture boundaries and dependency rules
        run: pnpm test:architecture

      - name: Build all apps and packages
        run: pnpm build
